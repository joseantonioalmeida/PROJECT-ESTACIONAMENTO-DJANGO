<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"></stop>
      <stop offset="100%" stop-color="#1e293b"></stop>
    </linearGradient>

    <!-- Accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"></stop>
      <stop offset="100%" stop-color="#6366f1"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="40" height="40" rx="10" fill="url(#bg)"></rect>

  <!-- Card -->
  <rect x="8" y="6" width="24" height="20" rx="6" fill="#020617" stroke="url(#accent)" stroke-width="1.2"></rect>

  <!-- P -->
  <text x="20" y="20" text-anchor="middle" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600" fill="#e2e8f0">
    P
  </text>

  <!-- Minimal car line -->
  <path d="M10 28 Q20 24 30 28" stroke="url(#accent)" stroke-width="1.2" fill="none"></path>

  <!-- Status dots -->
  <circle cx="15" cy="32" r="2" fill="#22c55e"></circle>
  <circle cx="25" cy="32" r="2" fill="#ef4444"></circle>
</svg>